name: Проверка и сборка silikbox
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Кэш зависимостей и Gradle Wrapper
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: libcore/go.sum
      - name: Проверка исходников
        run: |
          python tools/check_repository.py
          if ($LASTEXITCODE) { throw 'Repository validation failed' }
          python tools/check_dns_defaults.py
          if ($LASTEXITCODE) { throw 'DNS defaults migration validation failed' }
      - name: Android SDK и NDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdk 'platforms;android-35' 'build-tools;35.0.1' 'ndk;28.2.13676358'
          if ($LASTEXITCODE) { throw 'SDK installation failed' }
          "sdk.dir=$($env:ANDROID_HOME.Replace('\','/'))" | Set-Content local.properties
          python tools/prepare_assets.py
      - name: Сборка ядра из закреплённых исходников
        shell: pwsh
        run: |
          $env:ANDROID_NDK_HOME = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          ./buildScript/windows/Build-Libcore.ps1 -SdkRoot $env:ANDROID_HOME -JavaHome $env:JAVA_HOME
      - name: Проверки совместимости
        shell: pwsh
        run: |
          go -C libcore test -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api ./configcompat ./connectiontest ./bootstrapdns
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Сборка и проверка APK
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $logPath = Join-Path $env:RUNNER_TEMP "silikbox-gradle-$attempt.log"
            ./gradlew.bat --no-daemon --max-workers=2 app:assembleOssDebug 2>&1 | Tee-Object -FilePath $logPath
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) { break }
            $buildLog = Get-Content -LiteralPath $logPath -Raw
            $failureOffset = $buildLog.LastIndexOf('FAILURE: Build failed')
            $failure = if ($failureOffset -ge 0) { $buildLog.Substring($failureOffset) } else { '' }
            $downloadFailure = $failure -match 'Could not (?:resolve|GET|HEAD|get resource)'
            $temporaryHttpFailure = $failure -match 'Received status code (?:429|502|503|504)\b'
            if (!$downloadFailure -or !$temporaryHttpFailure -or $attempt -eq 3) {
              throw "APK build failed (exit $buildExitCode); no further retry"
            }
            $delaySeconds = 30 * $attempt
            Write-Warning "Dependency repository temporarily unavailable; retry $($attempt + 1)/3 in $delaySeconds seconds"
            Start-Sleep -Seconds $delaySeconds
          }
          $apk = @(Get-ChildItem app/build/outputs/apk/oss/debug -Filter '*arm64-v8a*.apk')
          if ($apk.Count -ne 1) { throw 'Expected one ARM64 APK' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/verify_apk.py $apk[0].FullName app/libs/libcore.aar artifacts/validation.json --runtime-label 1.14.4-silikbox.2
          if ($LASTEXITCODE) { throw 'Native APK validation failed' }
          python tools/unsigned_apk.py $apk[0].FullName artifacts/silikbox-ci-unsigned-arm64.apk
          'НЕПОДПИСАННЫЙ артефакт CI. Для установки используйте подписанные APK из Releases.' | Set-Content artifacts/README.txt
          Get-FileHash artifacts/silikbox-ci-unsigned-arm64.apk -Algorithm SHA256 | Format-List | Out-File artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: silikbox-ci-unsigned-arm64
          path: artifacts/
